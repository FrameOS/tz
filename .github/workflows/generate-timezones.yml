name: Generate Time Zones

on:
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '42 0 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate time zones
        id: generate
        run: |
          set -euo pipefail
          cd tools
          nimble install chrono
          nim c generate.nim
          ./generate

          if [ "$(stat -c %s tzdata.json)" -lt 1000000 ]; then
            echo "tzdata.json is less than 1mb. This is unexpecetd as it's normally around one floppy disk. Please check."
            exit 1
          fi
          
          mv ./tzdata.json ../dist/tzdata.json
          mv ./timezone_aliases.json ../dist/timezone_aliases.json
          mv ./tzdata/dstchanges.csv ../dist/dstchanges.csv
          mv ./tzdata/timezones.csv ../dist/timezones.csv
          cd ../dist

          git status

          if git diff --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          gzip -9 -f -k tzdata.json
          gzip -9 -f -k timezone_aliases.json
          gzip -9 -f -k dstchanges.csv
          gzip -9 -f -k timezones.csv
          date -u +"%Y-%m-%dT%H:%M:%SZ" > updated.txt
          echo "changed=true" >> "$GITHUB_OUTPUT"
  
      - name: Commit updated time zones
        if: steps.generate.outputs.changed == 'true' && github.event_name != 'pull_request'
        id: commit
        run: |
          set -euo pipefail
          git config user.name "FrameOS Bot"
          git config user.email "git@frameos.net"
          git add dist/*
          git commit -m "Update timezones"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Trigger FrameOS timezone import
        if: steps.generate.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          FRAMEOS_REPO_TOKEN: ${{ secrets.FRAMEOS_REPO_TOKEN }}
          TZ_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${FRAMEOS_REPO_TOKEN:-}" ]; then
            echo "FRAMEOS_REPO_TOKEN is required to dispatch the FrameOS timezone import workflow"
            exit 1
          fi

          python3 - <<'PY' > /tmp/frameos-dispatch.json
          import json
          import os

          tz_commit = os.environ["TZ_COMMIT"]
          print(json.dumps({
              "event_type": "timezone-data-updated",
              "client_payload": {
                  "tz_ref": tz_commit,
                  "tz_commit": tz_commit,
              },
          }))
          PY

          curl -fsS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${FRAMEOS_REPO_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/FrameOS/frameos/dispatches \
            --data @/tmp/frameos-dispatch.json
